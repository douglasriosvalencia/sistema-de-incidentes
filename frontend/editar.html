<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Editar Incidente
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html">

                Gestión de Incidentes

            </a>

        </div>

    </nav>

    <div class="container mt-4">

        <h2>
            Editar Incidente
        </h2>

        <form id="form-editar">

            <div class="mb-3">

                <label>
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label>
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    class="form-control">
                </textarea>

            </div>

            <div class="mb-3">

                <label>
                    Dirección
                </label>

                <input
                    type="text"
                    id="direccion"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label>
                    Prioridad
                </label>

                <select
                    id="prioridad"
                    class="form-control">

                    <option value="ALTA">
                        ALTA
                    </option>

                    <option value="MEDIA">
                        MEDIA
                    </option>

                    <option value="BAJA">
                        BAJA
                    </option>

                </select>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Actualizar Datos

            </button>

            <hr>

            <h4>
                Cambiar Estado
            </h4>

            <div class="mb-3">

                <label>
                    Estado
                </label>

                <select
                    id="estado"
                    class="form-control">

                    <option value="REPORTADO">
                        REPORTADO
                    </option>

                    <option value="EN_PROCESO">
                        EN_PROCESO
                    </option>

                    <option value="RESUELTO">
                        RESUELTO
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label>
                    Observación
                </label>

                <textarea
                    id="observacion"
                    class="form-control"
                    rows="3">
                </textarea>

            </div>

            <button
                type="button"
                id="btn-estado"
                class="btn btn-success">

                Cambiar Estado

            </button>

        </form>

    </div>

    <script src="/js/editar.js"></script>

</body>

</html>
