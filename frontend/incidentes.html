<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Listado de Incidentes
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html">

                Gestión de Incidentes

            </a>

            <div class="navbar-nav">

                <a
                    class="nav-link"
                    href="index.html">

                    Dashboard

                </a>

                <a
                    class="nav-link"
                    href="incidentes.html">

                    Incidentes

                </a>

                <a
                    class="nav-link"
                    href="crear.html">

                    Crear

                </a>

            </div>

        </div>

    </nav>

    <div class="container mt-4">

        <div class="d-flex justify-content-between mb-4">

            <h2>
                Incidentes Registrados
            </h2>

            <a
                href="crear.html"
                class="btn btn-success">

                Nuevo Incidente

            </a>

        </div>

        <!-- FILTROS -->

        <div class="row mb-3">

            <div class="col-md-4">

                <select
                    id="filtro-estado"
                    class="form-control">

                    <option value="">
                        Todos los estados
                    </option>

                    <option value="REPORTADO">
                        REPORTADO
                    </option>

                    <option value="EN_PROCESO">
                        EN_PROCESO
                    </option>

                    <option value="RESUELTO">
                        RESUELTO
                    </option>

                </select>

            </div>

            <div class="col-md-4">

                <select
                    id="filtro-prioridad"
                    class="form-control">

                    <option value="">
                        Todas las prioridades
                    </option>

                    <option value="ALTA">
                        ALTA
                    </option>

                    <option value="MEDIA">
                        MEDIA
                    </option>

                    <option value="BAJA">
                        BAJA
                    </option>

                </select>

            </div>

            <div class="col-md-4">

                <button
                    id="btn-filtrar"
                    class="btn btn-primary w-100">

                    Filtrar

                </button>

            </div>

        </div>

        <!-- TABLA -->

        <table
            class="table table-bordered table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Título</th>

                    <th>Prioridad</th>

                    <th>Estado</th>

                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody id="tabla-incidentes">

            </tbody>

        </table>

        <a
            href="index.html"
            class="btn btn-secondary">

            Volver al Dashboard

        </a>

    </div>

    <script src="js/incidentes.js"></script>

</body>

</html>
