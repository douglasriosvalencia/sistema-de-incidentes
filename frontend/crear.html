<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Crear Incidente
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css" />

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html">

            Gestión de Incidentes

        </a>

        <div class="navbar-nav">

            <a
                class="nav-link"
                href="index.html">

                Dashboard

            </a>

            <a
                class="nav-link"
                href="incidentes.html">

                Incidentes

            </a>

            <a
                class="nav-link"
                href="crear.html">

                Crear

            </a>

        </div>

    </div>

</nav>

    <div class="container mt-4">

        <h2 class="mb-4">
            Registrar Incidente
        </h2>

        <form id="form-incidente">

            <div class="mb-3">

                <label class="form-label">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    class="form-control"
                    rows="4"
                    required>
                </textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Dirección
                </label>

                <input
                    type="text"
                    id="direccion"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Prioridad
                </label>

                <select
                    id="prioridad"
                    class="form-control">

                    <option value="ALTA">
                        ALTA
                    </option>

                    <option value="MEDIA">
                        MEDIA
                    </option>

                    <option value="BAJA">
                        BAJA
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Tipo de Incidente
                </label>

                <select
                    id="tipo-incidente"
                    class="form-control">
                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Ubicación del incidente
                </label>

                <div
                    id="map"
                    style="
                        height:400px;
                        border:1px solid #ddd;
                        border-radius:10px;">
                </div>

                <small class="text-muted">
                    Haz clic sobre el mapa para marcar la ubicación.
                </small>

            </div>

            <!-- Coordenadas ocultas -->

            <input
                type="hidden"
                id="latitud">

            <input
                type="hidden"
                id="longitud">

            <button
                type="submit"
                class="btn btn-primary">

                Guardar Incidente

            </button>

            <a
                href="index.html"
                class="btn btn-secondary">

                Volver

            </a>

        </form>

    </div>

    <script
        src="https://unpkg.com/leaflet/dist/leaflet.js">
    </script>

    <script src="/js/api.js"></script>

    <script src="/js/crear.js"></script>

</body>

</html>
